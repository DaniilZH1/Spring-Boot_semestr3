<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учебные группы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="h3">Учебные группы</h1>
    <div class="mb-3 d-flex gap-2">
        <a th:href="@{/addGroupForm}" class="btn btn-primary">Добавить группу</a>
        <a th:href="@{/list}" class="btn btn-outline-secondary">Студенты</a>
        <a th:href="@{/users}" class="btn btn-outline-secondary">Пользователи</a>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button class="btn btn-outline-danger" type="submit">Выйти</button>
        </form>
    </div>
    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Название группы</th><th>Специальность</th><th>Курс</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="group : ${groups}">
            <td th:text="${group.id}"></td>
            <td th:text="${group.name}"></td>
            <td th:text="${group.specialty}"></td>
            <td th:text="${group.course}"></td>
            <td class="text-nowrap">
                <a th:href="@{/showUpdateGroupForm(groupId=${group.id})}" class="btn btn-sm btn-info">Изменить</a>
                <a th:href="@{/deleteGroup(groupId=${group.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить группу?')">Удалить</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(groups)}"><td colspan="5" class="text-center">Групп пока нет</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
