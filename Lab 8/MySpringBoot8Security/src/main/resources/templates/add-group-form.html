<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учебная группа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 720px">
    <h1 class="h3" th:text="${studyGroup.id == null ? 'Добавить учебную группу' : 'Изменить учебную группу'}"></h1>
    <hr>
    <form th:action="@{/saveGroup}" th:object="${studyGroup}" method="post">
        <input type="hidden" th:field="*{id}">
        <label class="form-label" for="name">Название группы</label>
        <input id="name" type="text" th:field="*{name}" class="form-control mb-3" required maxlength="50">
        <label class="form-label" for="specialty">Специальность</label>
        <input id="specialty" type="text" th:field="*{specialty}" class="form-control mb-3" required maxlength="100">
        <label class="form-label" for="course">Курс</label>
        <input id="course" type="number" th:field="*{course}" class="form-control mb-3" min="1" max="6" required>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/groups}" class="btn btn-outline-secondary">К списку групп</a>
    </form>
</main>
</body>
</html>
