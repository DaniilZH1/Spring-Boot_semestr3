<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <form th:action="@{/register/save}" th:object="${user}" method="post" class="card mx-auto p-4" style="max-width: 500px">
        <h1 class="h3 mb-3">Регистрация</h1>
        <div th:if="${param.success}" class="alert alert-success">Регистрация завершена. Теперь войдите.</div>
        <div th:if="${emailExists}" class="alert alert-danger">Пользователь с такой почтой уже зарегистрирован.</div>
        <label class="form-label" for="firstName">Имя</label>
        <input class="form-control" id="firstName" th:field="*{firstName}" required>
        <div class="text-danger mb-2" th:errors="*{firstName}"></div>
        <label class="form-label" for="lastName">Фамилия</label>
        <input class="form-control" id="lastName" th:field="*{lastName}" required>
        <div class="text-danger mb-2" th:errors="*{lastName}"></div>
        <label class="form-label" for="email">Электронная почта</label>
        <input class="form-control" id="email" type="email" th:field="*{email}" required>
        <div class="text-danger mb-2" th:errors="*{email}"></div>
        <label class="form-label" for="password">Пароль (не менее 6 символов)</label>
        <input class="form-control" id="password" type="password" th:field="*{password}" required>
        <div class="text-danger mb-3" th:errors="*{password}"></div>
        <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
        <a class="mt-3" th:href="@{/login}">Уже зарегистрированы? Войти</a>
    </form>
</main>
</body>
</html>
