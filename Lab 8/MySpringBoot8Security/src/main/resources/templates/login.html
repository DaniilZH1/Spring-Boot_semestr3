<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <form th:action="@{/login}" method="post" class="card mx-auto p-4" style="max-width: 460px">
        <h1 class="h3 mb-3">Вход</h1>
        <div th:if="${param.error}" class="alert alert-danger">Неверная почта или пароль.</div>
        <div th:if="${param.logout}" class="alert alert-info">Вы вышли из системы.</div>
        <label class="form-label" for="username">Электронная почта</label>
        <input class="form-control mb-3" id="username" name="username" type="email" required autofocus>
        <label class="form-label" for="password">Пароль</label>
        <input class="form-control mb-3" id="password" name="password" type="password" required>
        <button class="btn btn-primary" type="submit">Войти</button>
        <a class="mt-3" th:href="@{/register}">Создать учётную запись</a>
        <a th:href="@{/}">На главную</a>
    </form>
</main>
</body>
</html>
