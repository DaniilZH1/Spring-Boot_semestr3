<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление студентами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card mx-auto p-4" style="max-width: 620px">
        <h1 class="h3">Система управления студентами</h1>
        <p>Войдите в систему или создайте учётную запись.</p>
        <div class="d-flex gap-2">
            <a th:href="@{/login}" class="btn btn-primary">Войти</a>
            <a th:href="@{/register}" class="btn btn-outline-primary">Регистрация</a>
        </div>
    </div>
</main>
</body>
</html>
