<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Карточка студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 720px">
    <h1 class="h3" th:text="${student.id == null ? 'Добавить студента' : 'Изменить студента'}"></h1>
    <hr>
    <form th:action="@{/saveStudent}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}">
        <label class="form-label" for="name">Имя</label>
        <input id="name" type="text" th:field="*{name}" class="form-control mb-3" required maxlength="15">
        <label class="form-label" for="surname">Фамилия</label>
        <input id="surname" type="text" th:field="*{surname}" class="form-control mb-3" required maxlength="25">
        <label class="form-label" for="faculty">Факультет</label>
        <input id="faculty" type="text" th:field="*{faculty}" class="form-control mb-3" maxlength="20">
        <label class="form-label" for="age">Возраст</label>
        <input id="age" type="number" th:field="*{age}" class="form-control mb-3" min="1" max="120" required>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/list}" class="btn btn-outline-secondary">К списку</a>
    </form>
</main>
</body>
</html>
