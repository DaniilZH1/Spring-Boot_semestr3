<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="h3">Зарегистрированные пользователи</h1>
    <div class="d-flex gap-2 mb-3">
        <a th:href="@{/list}" class="btn btn-outline-secondary">Студенты</a>
        <a th:href="@{/groups}" class="btn btn-outline-secondary">Учебные группы</a>
        <form th:action="@{/logout}" method="post" class="ms-auto"><button class="btn btn-outline-danger" type="submit">Выйти</button></form>
    </div>
    <table class="table table-bordered table-striped">
        <thead><tr><th>Имя</th><th>Фамилия</th><th>Электронная почта</th></tr></thead>
        <tbody>
        <tr th:each="user : ${users}"><td th:text="${user.firstName}"></td><td th:text="${user.lastName}"></td><td th:text="${user.email}"></td></tr>
        <tr th:if="${#lists.isEmpty(users)}"><td colspan="3" class="text-center">Пользователей пока нет</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
