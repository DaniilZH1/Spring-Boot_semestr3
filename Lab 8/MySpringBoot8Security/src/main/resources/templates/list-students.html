<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список студентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="h3">Список студентов</h1>
    <div class="mb-3 d-flex gap-2">
        <a th:href="@{/addStudentForm}" class="btn btn-primary">Добавить студента</a>
        <a th:href="@{/groups}" class="btn btn-outline-secondary">Учебные группы</a>
        <a th:href="@{/users}" class="btn btn-outline-secondary">Пользователи</a>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button class="btn btn-outline-danger" type="submit">Выйти</button>
        </form>
    </div>
    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Факультет</th><th>Возраст</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.surname}"></td>
            <td th:text="${student.faculty}"></td>
            <td th:text="${student.age}"></td>
            <td class="text-nowrap">
                <a th:href="@{/showUpdateForm(studentId=${student.id})}" class="btn btn-sm btn-info">Изменить</a>
                <a th:href="@{/deleteStudent(studentId=${student.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить студента?')">Удалить</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="text-center">Студентов пока нет</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
